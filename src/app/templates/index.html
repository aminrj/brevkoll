<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling":[{"code":".*","swap":true}]}'>
  <title>brevkoll</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <main>
    <h1>brevkoll</h1>
    <p>Photograph or upload a letter from school. You get a short summary, what to do, and the dates.</p>
    <form hx-post="/ui/decode" hx-target="#result" hx-encoding="multipart/form-data"
          hx-indicator="#busy" action="/ui/decode" method="post" enctype="multipart/form-data">
      <label for="file">Letter (photo, PNG, JPEG or PDF, up to 10 MB)</label>
      <input id="file" type="file" name="file" accept="image/*,application/pdf" required>
      <label for="language">Answer in</label>
      <select id="language" name="language">
        {% for code, name in languages %}
        <option value="{{ code }}">{{ name }}</option>
        {% endfor %}
      </select>
      <button type="submit">Decode letter</button>
      <p id="busy" class="htmx-indicator">Reading the letter...</p>
    </form>
    <p class="note">The letter text is sent to the language model. Nothing is stored on the server.</p>
    <section id="result" aria-live="polite"></section>
  </main>
</body>
</html>
