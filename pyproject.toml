[project]
name = "app"
version = "0.1.0"
description = "Built through the secure AI software factory"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pillow>=13.0.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "radon==6.0.1",
    "coverage==7.6.10",
    "diff-cover==9.2.1",
    "mutmut==2.5.1",
    "import-linter==2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/tooling"]   # holdout runs only in CI, explicitly
pythonpath = ["src"]
markers = [
    "ac(id): this test enforces acceptance criterion <id> from thoughts/<n>/spec.md (checked by scripts/trace.py)",
    "control(id): this test enforces threat-model control <id> from thoughts/<n>/threat-model.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S603", "S607"]   # dev tooling that shells out to git, mutmut and coverage

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = true
