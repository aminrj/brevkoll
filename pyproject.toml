[project]
name = "app"
version = "0.1.0"
description = "Built through the secure AI software factory"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pillow>=13.0.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]   # holdout runs only in CI, explicitly
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
